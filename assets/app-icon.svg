<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- JL Emulator: monograma JL en oro 3D con filo azul, sobre fibra de carbono con circuitos
       luminosos, rodeado de mando, stick analógico y cruceta. Fuente de assets/AppIcon.appiconset. -->
  <defs>
    <!-- Fibra de carbono: tejido 2x2 de sarga -->
    <linearGradient id="cfA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="0.5" stop-color="#15171b"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="cfB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2227"/>
      <stop offset="0.5" stop-color="#0e0f12"/>
      <stop offset="1" stop-color="#060708"/>
    </linearGradient>
    <pattern id="carbon" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="url(#cfA)"/>
      <rect x="16" width="16" height="16" fill="url(#cfB)"/>
      <rect y="16" width="16" height="16" fill="url(#cfB)"/>
      <rect x="16" y="16" width="16" height="16" fill="url(#cfA)"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#0b1a33" stop-opacity="0.25"/>
      <stop offset="0.65" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1e3a8a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- Oro pulido -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.18" stop-color="#f7d774"/>
      <stop offset="0.45" stop-color="#d4af37"/>
      <stop offset="0.62" stop-color="#a87d17"/>
      <stop offset="0.8" stop-color="#e9c55a"/>
      <stop offset="1" stop-color="#8a6410"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4a08"/>
      <stop offset="1" stop-color="#2e1f02"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d774"/>
      <stop offset="0.35" stop-color="#d4af37"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8a6410"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="0.5" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.4" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0b1b4a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <!-- Letras J y L -->
    <path id="J" d="M286 300 H556 V598 Q556 726 432 726 H374 Q286 726 286 640 V586 H396 V610 Q396 626 414 626 H426 Q446 626 446 606 V392 H286 Z"/>
    <path id="L" d="M590 300 H700 V622 H824 V726 H590 Z"/>
  </defs>

  <!-- Fondo -->
  <rect width="1024" height="1024" fill="url(#carbon)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <circle cx="512" cy="500" r="430" fill="url(#core)"/>

  <!-- Circuitos luminosos -->
  <g fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.95">
    <path d="M60 210 H190 L250 270 H300"/>
    <path d="M40 420 H150 L200 370"/>
    <path d="M964 230 H840 L780 290 H740"/>
    <path d="M984 430 H880 L830 380"/>
    <path d="M512 40 V120 L470 162"/>
    <path d="M600 40 V96 L640 136"/>
    <path d="M90 860 H230 L290 800"/>
    <path d="M934 870 H800 L740 810"/>
    <path d="M420 990 V930 L470 880"/>
    <path d="M610 990 V936 L560 886"/>
  </g>
  <g fill="#7dd3fc" filter="url(#glow)">
    <circle cx="60" cy="210" r="11"/><circle cx="40" cy="420" r="11"/><circle cx="964" cy="230" r="11"/>
    <circle cx="984" cy="430" r="11"/><circle cx="512" cy="40" r="11"/><circle cx="600" cy="40" r="11"/>
    <circle cx="90" cy="860" r="11"/><circle cx="934" cy="870" r="11"/><circle cx="420" cy="990" r="11"/>
    <circle cx="610" cy="990" r="11"/>
  </g>

  <!-- Anillo oro / azul -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="#38bdf8" stroke-width="18" opacity="0.35" filter="url(#bigGlow)"/>
  <circle cx="512" cy="512" r="372" fill="none" stroke="url(#ring)" stroke-width="12"/>
  <circle cx="512" cy="512" r="352" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>

  <!-- Stick analógico (izquierda) -->
  <g transform="translate(188 512)" filter="url(#shadow)">
    <circle r="78" fill="url(#metal)" stroke="#6b7280" stroke-width="4"/>
    <circle r="60" fill="#0b0f14" stroke="#1f2937" stroke-width="3"/>
    <circle r="46" fill="url(#ball)" stroke="#93c5fd" stroke-width="3"/>
    <ellipse cx="-14" cy="-18" rx="16" ry="10" fill="#fff" opacity="0.45"/>
  </g>
  <!-- Cruceta (derecha) -->
  <g transform="translate(836 512)" filter="url(#shadow)">
    <circle r="78" fill="url(#metal)" stroke="#6b7280" stroke-width="4"/>
    <path d="M-18 -56 H18 V-18 H56 V18 H18 V56 H-18 V18 H-56 V-18 H-18 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <path d="M-18 -56 H18 V-18 H-18 Z" fill="#1e293b"/>
    <circle r="9" fill="#38bdf8" filter="url(#glow)"/>
  </g>
  <!-- Mando (abajo) -->
  <g transform="translate(512 842)" filter="url(#shadow)">
    <path d="M-180 -40 Q-150 -78 -90 -70 H90 Q150 -78 180 -40 Q214 30 176 74 Q146 102 110 64 L80 30 H-80 L-110 64 Q-146 102 -176 74 Q-214 30 -180 -40 Z" fill="url(#metal)" stroke="#d4af37" stroke-width="5"/>
    <path d="M-120 -24 H-102 V-42 H-84 V-24 H-66 V-6 H-84 V12 H-102 V-6 H-120 Z" fill="#0b0f14"/>
    <circle cx="96" cy="-34" r="11" fill="#22c55e"/>
    <circle cx="120" cy="-12" r="11" fill="#ef4444"/>
    <circle cx="96" cy="10" r="11" fill="#3b82f6"/>
    <circle cx="72" cy="-12" r="11" fill="#f0abfc"/>
    <rect x="-34" y="-20" width="26" height="9" rx="4" fill="#38bdf8" filter="url(#glow)"/>
    <rect x="8" y="-20" width="26" height="9" rx="4" fill="#38bdf8" filter="url(#glow)"/>
    <path d="M-170 -36 Q-140 -66 -90 -60 H90" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="4"/>
  </g>

  <!-- JL: resplandor azul, extrusión, cara de oro, filo azul y brillo -->
  <g filter="url(#bigGlow)" opacity="0.9">
    <use href="#J" fill="#2563eb"/><use href="#L" fill="#2563eb"/>
  </g>
  <g fill="url(#goldSide)">
    <use href="#J" transform="translate(22 22)"/><use href="#L" transform="translate(22 22)"/>
    <use href="#J" transform="translate(16 16)"/><use href="#L" transform="translate(16 16)"/>
    <use href="#J" transform="translate(10 10)"/><use href="#L" transform="translate(10 10)"/>
    <use href="#J" transform="translate(5 5)"/><use href="#L" transform="translate(5 5)"/>
  </g>
  <g fill="url(#gold)" stroke="#38bdf8" stroke-width="7" stroke-linejoin="round">
    <use href="#J"/><use href="#L"/>
  </g>
  <g fill="none" stroke="#fffbe6" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M296 312 H546"/>
    <path d="M600 312 H690"/>
    <path d="M600 316 V600"/>
  </g>
</svg>
