<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1A1C24"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </radialGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#9AA3B2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- Fondo obsidiana satinado -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Arco orbital ámbar con halo -->
  <path d="M 190 620 A 340 340 0 0 1 834 620" fill="none" stroke="#D4AF37" stroke-width="22" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M 190 620 A 340 340 0 0 1 834 620" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  <!-- Monograma JL en titanio cepillado -->
  <g fill="none" stroke="url(#titanium)" stroke-width="84" stroke-linecap="butt">
    <path d="M 600 300 L 600 712 L 770 712"/>
    <path d="M 330 300 L 330 596 Q 330 706 420 706"/>
  </g>
  <!-- Filo de luz sobre el monograma -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6">
    <path d="M 566 300 L 566 640"/>
    <path d="M 276 300 L 276 556"/>
  </g>
  <!-- Borde fino translúcido (1 px a escala de icono) -->
  <rect x="6" y="6" width="1012" height="1012" rx="0" fill="none" stroke="#E2E8F0" stroke-opacity="0.35" stroke-width="4"/>
</svg>
